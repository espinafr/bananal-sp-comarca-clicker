name: Publicar versão do jogo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Gerar executáveis e publicar release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Baixar código da tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar SDK do .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Gerar versões mínima e completa
        shell: pwsh
        run: ./.github/scripts/publicar.ps1

      - name: Publicar executáveis na release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arquivos = @(
            'dist/bananal-minimo-win-x64.exe',
            'dist/bananal-completo-win-x64.exe',
            'dist/SHA256SUMS.txt'
          )

          gh release view "$env:TAG" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            # Permite executar novamente o workflow para a mesma tag.
            gh release upload "$env:TAG" @arquivos --clobber
          } else {
            gh release create "$env:TAG" @arquivos `
              --verify-tag `
              --title "Bananal — $env:TAG" `
              --notes-file .github/notas-da-versao.md `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível publicar a release.' }
